<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#15121f">
    <title>Pixel Action RPG</title>
        <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #15121f;
        }
        .controls {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
            z-index: 20;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(80, 30, 130, 0.65);
            border: 2px solid #b19cd9;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .ctrl-btn:active {
            background: rgba(130, 60, 200, 0.9);
            transform: scale(0.95);
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
   </style>
</head>
<body>

    <!-- --- UI & HUD --- -->
    <div id="hud">HP: <span id="hp">100</span> | Score: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <!-- --- TOUCH CONTROLS --- -->
    <div class="controls">
        <div class="btn-group">
            <button class="ctrl-btn" id="leftBtn">←</button>
            <button class="ctrl-btn" id="rightBtn">→</button>
            <button class="ctrl-btn" id="jumpBtn" style="background: rgba(30, 130, 80, 0.65); border-color: #76ff76;">↑</button>
        </div>
        <div class="btn-group">
            <button class="ctrl-btn" id="attackBtn" style="background: rgba(180, 40, 40, 0.65); border-color: #ff7676;">⚔️</button>
        </div>
    </div>

    <script>
        // Force Landscape Lock
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = 800;
        canvas.height = 450;

        let score = 0;
        let hp = 100;
        let isGameOver = false;
        let hitCooldown = 0;

        // ==========================================
        // --- ASSETS & IMAGE LOADING ---
        // ==========================================
        const bgImg = new Image();
        bgImg.src = "preview-old-dark-castle-interior-tileset.png";

        const playerAssets = {
            idle: new Image(),
            run: new Image(),
            jump: new Image(),
            attack: new Image()
        };

        playerAssets.idle.src = "idle.png";
        playerAssets.run.src = "run.png";
        playerAssets.jump.src = "jump.png";
        playerAssets.attack.src = "attack.png"; 
      
        const enemyWalkImg = new Image();
        enemyWalkImg.src = "ogre-walk.png";

        const enemyAttackImg = new Image();
        enemyAttackImg.src = "ogre-attack.png";

        // ==========================================
        // --- LEVEL DESIGN & PLATFORMS ---
        // ==========================================
        const platforms = [
            { x: 0, y: 395, width: 210, height: 60, jumpAtEnd: true },   
            { x: 213, y: 360, width: 206, height: 20, jumpAtEnd: true },   
            { x: 423, y: 395, width: 103, height: 60, jumpAtEnd: true },   
            { x: 587, y: 390, width: 190, height: 95, jumpAtEnd: true },     
            { x: 510, y: 312, width: 90, height: 15, jumpAtEnd: true },   
            { x: 689, y: 380, width: 55,  height: 70,  isStair: true },  
            { x: 712, y: 367, width: 55,  height: 85,  isStair: true },  
            { x: 736, y: 347, width: 55,  height: 120, isStair: true },  
            { x: 759, y: 328, width: 50,  height: 130, isStair: true },  
        ];   

        // ==========================================
        // --- PLAYER (Large Scale) ---
        // ==========================================
        let player = {
            x: 50,
            y: 180,
            width: 130,
            height: 160,
            vx: 0,
            vy: 0,
            speed: 3.5,
            jumpPower: -11,
            gravity: 0.5,
            isGrounded: false,
            facing: 1,          
            state: "idle",      
            frameX: 0,
            frameTimer: 0,
            attackTimer: 0,     
            frameCounts: {
                idle: 4,
                run: 7,
                jump: 4,
                attack: 5
            }
        };

        // ==========================================
        // --- ENEMIES ---
        // ==========================================
        let enemies = [];

        function spawnEnemy() {
            if (isGameOver) return;
            enemies.push({
                x: 720 + (Math.random() * 40 - 20),
                y: 200,
                width: 120,
                height: 150,
                hp: 50,
                maxHp: 50,
                vx: -1.2,
                vy: 0,
                jumpPower: -8.7,
                isGrounded: false,
                facing: -1,
                state: "walk", 
                frameX: 0,
                frameTimer: 0,
                walkFrames: 6,
                attackFrames: 7
            });
        }

        setInterval(spawnEnemy, 5000);

        // ==========================================
        // --- INPUT & CONTROLS ---
        // ==========================================
        let keys = { left: false, right: false, jump: false };

        function setupButton(id, action) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); action(true); }, {passive: false});
            btn.addEventListener("touchend", (e) => { e.preventDefault(); action(false); }, {passive: false});
            btn.addEventListener("mousedown", () => action(true));
            btn.addEventListener("mouseup", () => action(false));
        }

        setupButton("leftBtn", (val) => { keys.left = val; if(val) player.facing = -1; });
        setupButton("rightBtn", (val) => { keys.right = val; if(val) player.facing = 1; });
        setupButton("jumpBtn", (val) => {
            if (val && player.isGrounded && !isGameOver) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }
        });

        setupButton("attackBtn", (val) => {
            if (val && !isGameOver && player.attackTimer <= 0) {
                player.state = "attack";
                player.frameX = 0;
                player.attackTimer = 18; 

                let attackRange = 65;
                let hitBoxLeft = player.facing > 0 ? player.x + player.width : player.x - attackRange;
                let hitBoxRight = player.facing > 0 ? player.x + player.width + attackRange : player.x;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    if (
                        e.x + e.width > hitBoxLeft &&
                        e.x < hitBoxRight &&
                        player.y + player.height > e.y &&
                        player.y < e.y + e.height
                    ) {
                        e.hp -= 25; 
                        e.vx = player.facing * 3; 
                        if (e.hp <= 0) {
                            enemies.splice(i, 1);
                            score += 20;
                            document.getElementById("score").innerText = score;
                        }
                    }
                }
            }
        });

        // ==========================================
        // --- UPDATE LOGIC ---
        // ==========================================
        function update() {
            if (isGameOver) return;

            player.vx = 0;
            if (keys.left) { player.vx = -player.speed; player.x += player.vx; }
            if (keys.right) { player.vx = player.speed; player.x += player.vx; }

            player.vy += player.gravity;
            player.y += player.vy;
            
            let onAnyPlatform = false;

            for (let p of platforms) {
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.width &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 18 &&
                    player.vy >= 0 
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                    onAnyPlatform = true;
                }
            }

            const stairLeft = 700;
            const stairRight = 800;
            const stairBottomY = 450;
            const stairTopY = 375;

            if (player.x + player.width > stairLeft && player.x < stairRight) {
                let progress = (player.x + player.width / 2 - stairLeft) / (stairRight - stairLeft);
                let targetStairY = stairBottomY - (progress * (stairBottomY - stairTopY));

                if (
                    player.y + player.height >= targetStairY - 10 && 
                    player.y + player.height <= targetStairY + 15 &&
                    player.vy >= 0 
                ) {
                    player.y = targetStairY - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                    onAnyPlatform = true;
                }
            }

            if (!onAnyPlatform) {
                player.isGrounded = false;
            }

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            if (player.y > canvas.height) {
                hp = 0;
                document.getElementById("hp").innerText = hp;
                isGameOver = true;
            }

            if (hitCooldown > 0) hitCooldown--;
            if (player.attackTimer > 0) player.attackTimer--;

            if (player.attackTimer > 0) {
                player.state = "attack";
            } else if (!player.isGrounded) {
                player.state = "jump";
            } else if (Math.abs(player.vx) > 0.1) {
                player.state = "run";
            } else {
                player.state = "idle";
            }

            // Enemy Updates
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];

                let dxPlayer = (player.x + player.width / 2) - (e.x + e.width / 2);
                let dyPlayer = (player.y + player.height / 2) - (e.y + e.height / 2);

                if (Math.abs(dxPlayer) < 55 && Math.abs(dyPlayer) < 50) {
                    if (e.state !== "attack") {
                        e.state = "attack";
                        e.frameX = 0;
                    }
                    e.vx = 0;
                    e.facing = dxPlayer > 0 ? 1 : -1;
                } else {
                    if (e.state !== "walk") {
                        e.state = "walk";
                        e.frameX = 0;
                    }
                    e.vx = e.facing * 1.2;
                    e.x += e.vx;
                }

                e.vy += player.gravity;
                e.y += e.vy;
                e.isGrounded = false;

                e.frameTimer++;
                let totalFrames = (e.state === "attack") ? e.attackFrames : e.walkFrames;
                let animSpeed = (e.state === "attack") ? 8 : 10;

                if (e.frameTimer % animSpeed === 0) {
                    e.frameX = (e.frameX + 1) % totalFrames;
                }

                let currentPlatform = null;
                for (let p of platforms) {
                    if (
                        e.x + e.width > p.x &&
                        e.x < p.x + p.width &&
                        e.y + e.height >= p.y &&
                        e.y + e.height - e.vy <= p.y + 18
                    ) {
                        e.y = p.y - e.height;
                        e.vy = 0;
                        e.isGrounded = true;
                        currentPlatform = p;
                    }
                }

                if (e.isGrounded && currentPlatform && currentPlatform.jumpAtEnd) {
                    let paddingOffset = 12;
                    let nearRightEdge = (e.vx > 0 && (e.x + e.width - paddingOffset) >= currentPlatform.x + currentPlatform.width);
                    let nearLeftEdge = (e.vx < 0 && (e.x + paddingOffset) <= currentPlatform.x);

                    if (nearRightEdge || nearLeftEdge) {
                        e.vy = e.jumpPower;
                        e.isGrounded = false;
                    }
                }

                if (e.x < 0) {
                    e.x = 0;
                    e.vx *= -1;
                    e.facing = 1;
                } else if (e.x > canvas.width - e.width) {
                    e.x = canvas.width - e.width;
                    e.vx *= -1;
                    e.facing = -1;
                }

                if (e.x < -100 || e.y > canvas.height) {
                    enemies.splice(i, 1);
                    continue;
                }

                let isTouching = false;
                if (e.state === "attack") {
                    let attackReach = 70;
                    let attackLeft = e.facing === 1 ? e.x : e.x - attackReach;
                    let attackRight = e.facing === 1 ? e.x + e.width + attackReach : e.x + e.width;
                    
                    if (
                        player.x + player.width > attackLeft &&
                        player.x < attackRight &&
                        player.y + player.height > e.y &&
                        player.y < e.y + e.height
                    ) {
                        isTouching = true;
                    }
                } else {
                    let dx = (player.x + player.width / 2) - (e.x + e.width / 2);
                    let dy = (player.y + player.height / 2) - (e.y + e.height / 2);
                    if (Math.abs(dx) < 45 && Math.abs(dy) < 45) {
                        isTouching = true;
                    }
                }

                if (isTouching && hitCooldown === 0) {
                    hp -= 2;
                    hitCooldown = 40;
                    if (hp < 0) hp = 0;
                    document.getElementById("hp").innerText = hp;
                    if (hp === 0) {
                        isGameOver = true;
                    }
                }
            }
        }

        // ==========================================
        // --- DRAW LOGIC ---
        // ==========================================
        function drawBackground() {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.scale(player.facing, 1);

            let currentSheet = playerAssets[player.state] || playerAssets.idle;

            if (!currentSheet.complete || currentSheet.naturalWidth === 0) {
                ctx.fillStyle = "#3498db";
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                ctx.restore();
                return;
            }

            let totalFrames = player.frameCounts[player.state] || 1;
            let frameWidth = currentSheet.width / totalFrames || player.width;
            let frameHeight = currentSheet.height;

            player.frameTimer++;
            if (player.frameTimer > 6) {
                player.frameX = (player.frameX + 1) % totalFrames;
                player.frameTimer = 0;
            }

            if (player.frameX >= totalFrames) player.frameX = 0;

            ctx.drawImage(
                currentSheet,
                player.frameX * frameWidth, 0, frameWidth, frameHeight,
                -player.width / 2, -player.height / 2, player.width, player.height
            );

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawPlayer();

            for (let e of enemies) {
                let currentImg = (e.state === "attack") ? enemyAttackImg : enemyWalkImg;
                
                if (!currentImg.complete || currentImg.naturalWidth === 0) {
                    ctx.fillStyle = "#e74c3c";
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                    continue;
                }

                let totalFrames = (e.state === "attack") ? e.attackFrames : e.walkFrames;
                let frameWidth = currentImg.width / totalFrames;
                let frameHeight = currentImg.height;

                ctx.save();
                if (e.facing === 1) {
                    ctx.scale(-1, 1);
                    ctx.drawImage(
                        currentImg,
                        e.frameX * frameWidth, 0, frameWidth, frameHeight,
                        -e.x - e.width, e.y, e.width, e.height
                    );
                } else {
                    ctx.drawImage(
                        currentImg,
                        e.frameX * frameWidth, 0, frameWidth, frameHeight,
                        e.x, e.y, e.width, e.height
                    );
                }
                ctx.restore();

                ctx.fillStyle = "#555";
                ctx.fillRect(e.x, e.y - 12, e.width, 5);
                ctx.fillStyle = "#00ff00";
                ctx.fillRect(e.x, e.y - 12, e.width * (e.hp / e.maxHp), 5);
            }
       
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff4d4d";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("YOU DIED", canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#fff";
                ctx.font = "14px sans-serif";
                ctx.fillText("Refresh page to try again", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
